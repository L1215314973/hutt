<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的订单 - 长安风物志</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/order.css">
</head>
<body>

  <div class="announcement-bar">
    <span>✦ 感谢惠顾，祝您购物愉快 ✦</span>
  </div>

  <header class="main-header">
    <div class="container">
      <a href="../index.html" class="logo">
        <img src="../images/logo/logo.png" alt="长安风物志" onerror="this.style.display='none'">
        <span class="logo-text">长安风物志<span class="logo-sub">Tang Dynasty · Oriental Aesthetics</span></span>
      </a>
      <nav class="main-nav">
        <a href="../index.html">首页</a>
        <a href="products.html">全部商品</a>
        <a href="about.html">关于我们</a>
        <a href="cart.html">购物车</a>
        <a href="order.html" class="active">我的订单</a>
      </nav>
      <div class="nav-actions">
        <a href="login.html" class="nav-icon" title="登录"><img src="../images/icons/user.svg" alt="用户" style="width:22px;height:22px;" onerror="this.outerHTML='👤'"></a>
        <a href="cart.html" class="nav-icon" title="购物车">
          <img src="../images/icons/cart.svg" alt="购物车" style="width:22px;height:22px;" onerror="this.outerHTML='🛒'">
          <span class="cart-badge" id="cart-count">0</span>
        </a>
        <button class="mobile-menu-btn" aria-label="菜单">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="page-banner">
      <div class="container">
        <h1>我的订单</h1>
        <p>查看订单状态，追踪物流信息</p>
      </div>
    </section>

    <div class="container">
      <!-- 状态筛选 Tab -->
      <div class="order-tabs">
        <button class="order-tab active" data-status="all">全部订单</button>
        <button class="order-tab" data-status="pending">待付款</button>
        <button class="order-tab" data-status="shipped">待发货</button>
        <button class="order-tab" data-status="completed">已完成</button>
      </div>

      <!-- 订单列表 -->
      <div class="order-list" id="orderList">
        <!-- JS 动态渲染 -->
      </div>

      <!-- 空订单 -->
      <div class="order-empty" id="orderEmpty" style="display:none">
        <span class="empty-icon"><img src="../images/icons/order.svg" alt="" style="width:60px;height:60px;" onerror="this.outerHTML='📋'"></span>
        <p>暂无相关订单</p>
        <p class="empty-sub">快去挑选心仪的风物吧</p>
        <a href="products.html" class="btn btn-primary">去逛逛</a>
      </div>
    </div>
  </main>

  <footer class="main-footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-col"><h3>长安风物志</h3><p>传承东方美学，汇聚非遗匠心。</p></div>
        <div class="footer-col"><h3>快速链接</h3><a href="../index.html">首页</a><a href="products.html">全部商品</a></div>
        <div class="footer-col"><h3>帮助中心</h3><a href="#">购物指南</a><a href="#">配送说明</a></div>
        <div class="footer-col"><h3>联系我们</h3><p>📞 666-888-6688<br>📧 service@chang-an.com</p></div>
      </div>
      <div class="footer-bottom"><p>&copy; 2026 长安风物志. All Rights Reserved. </p></div>
    </div>
  </footer>

  <script src="../js/storage.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/order.js"></script>
</body>
</html>
